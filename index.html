<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Surat Izin Ekstrakurikuler PMR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Times New Roman fallback untuk surat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        serif: ['Times New Roman', 'Times', 'Georgia', 'serif'],
                    },
                    colors: {
                        pmr: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            200: '#fecaca',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            800: '#991b1b',
                            900: '#7f1d1d',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Pengaturan khusus untuk mode cetak (Print / Simpan PDF) */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-letter, #printable-letter * {
                visibility: visible;
            }
            #printable-letter {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 15mm 20mm !important;
                box-shadow: none !important;
                border: none !important;
                background: white !important;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        /* Mencegah scroll saat menggambar tanda tangan di layar sentuh */
        #signature-pad {
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Notifikasi Toast (Pengganti alert) -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

    <!-- Header Resmi PMR -->
    <header class="bg-gradient-to-r from-pmr-700 via-pmr-600 to-pmr-800 text-white shadow-lg border-b-4 border-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-4 text-center sm:text-left">
                    <!-- Logo Perisai PMR Wira -->
                    <div class="bg-white p-1.5 rounded-2xl shadow-md flex-shrink-0 mx-auto sm:mx-0">
                        <img src="https://i.ibb.co.com/8gPNBC6s/LOGO-PMR-WIRA-1.png" alt="Logo PMR Wira" class="w-12 h-14 object-contain" onerror="this.onerror=null;this.src='https://placehold.co/96x112/FFF200/D71920?text=PMR';">
                    </div>
                    <div>
                        <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white/20 text-white mb-1">
                            <span>PALANG MERAH REMAJA (PMR) &bull; SMK NEGERI 1 SUKOHARJO</span>
                        </div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">
                            Formulir Surat Izin Tidak Mengikuti Kegiatan Ekstrakurikuler PMR
                        </h1>
                        <p class="text-pmr-100 text-xs sm:text-sm mt-0.5">
                            Sistem Administrasi Perizinan Anggota Online &bull; Cepat, Resmi & Terdokumentasi
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        
        <!-- Pengaturan Tersembunyi (Hardcoded untuk SMK NEGERI 1 SUKOHARJO) -->
        <div class="hidden" aria-hidden="true">
            <input type="email" id="target-email" value="pmrwiraskorsa26@gmail.com">
            <input type="text" id="school-name" value="SMK NEGERI 1 SUKOHARJO">
            <select id="send-method">
                <option value="formsubmit" selected>formsubmit</option>
            </select>
            <input type="text" id="ejs-public-key" value="">
            <input type="text" id="ejs-service-id" value="">
            <input type="text" id="ejs-template-id" value="">
            <input type="url" id="gas-webhook-url" value="">
        </div>

        <!-- Layout 2 Kolom: Kiri Form Input, Kanan Live Preview Surat -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- KOLOM KIRI: FORMULIR ISIAN ANGGOTA (5 Kolom di layar besar) -->
            <div class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <span class="w-2.5 h-6 bg-pmr-600 rounded-full"></span>
                        <h2 class="text-base sm:text-lg font-bold text-slate-800">Data Permohonan Izin</h2>
                    </div>
                    <button type="button" id="btn-reset-form" onclick="resetForm()" class="text-xs font-semibold text-slate-500 hover:text-pmr-600 px-2.5 py-1.5 rounded-lg hover:bg-pmr-50 transition cursor-pointer">
                        Reset Form
                    </button>
                </div>

                <!-- Indikator Langkah (Stepper) -->
                <div class="px-6 pt-5 pb-2">
                    <div class="flex items-center justify-between text-xs font-semibold mb-2">
                        <span id="step-label" class="text-pmr-600">Langkah 1 dari 3: Identitas Anggota</span>
                        <span id="step-percent" class="text-slate-400">33%</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div id="step-progress-bar" class="bg-pmr-600 h-full transition-all duration-300 rounded-full" style="width: 33.33%"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-3">
                        <button type="button" id="tab-step-1" class="py-1.5 px-2 rounded-lg text-[11px] font-bold bg-pmr-50 text-pmr-700 border border-pmr-200 transition text-center cursor-pointer">
                            1. Identitas
                        </button>
                        <button type="button" id="tab-step-2" class="py-1.5 px-2 rounded-lg text-[11px] font-semibold bg-slate-50 text-slate-500 border border-slate-200 transition text-center cursor-pointer">
                            2. Keterangan Izin
                        </button>
                        <button type="button" id="tab-step-3" class="py-1.5 px-2 rounded-lg text-[11px] font-semibold bg-slate-50 text-slate-500 border border-slate-200 transition text-center cursor-pointer">
                            3. TTD & Kirim
                        </button>
                    </div>
                </div>

                <form id="pmr-izin-form" class="p-6 pt-4" novalidate>
                    <!-- SLIDE 1: IDENTITAS ANGGOTA -->
                    <div id="form-step-1" class="space-y-4">
                        <div>
                            <label for="nama" class="block text-sm font-semibold text-slate-700 mb-1">
                                Nama Lengkap Anggota <span class="text-pmr-600">*</span>
                            </label>
                            <input type="text" id="nama" required placeholder="Masukkan nama lengkap Anda"
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-pmr-500 focus:border-pmr-500 outline-none transition">
                        </div>

                        <div>
                            <label for="kelas" class="block text-sm font-semibold text-slate-700 mb-1">
                                Kelas / Jurusan <span class="text-pmr-600">*</span>
                            </label>
                            <input type="text" id="kelas" required placeholder="Contoh: XI AKL 2"
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-pmr-500 focus:border-pmr-500 outline-none transition">
                        </div>

                        <div>
                            <label for="whatsapp" class="block text-sm font-semibold text-slate-700 mb-1">
                                Nomor WhatsApp Anggota / Orang Tua <span class="text-pmr-600">*</span>
                            </label>
                            <input type="tel" id="whatsapp" required placeholder="Contoh: 081234567890"
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-pmr-500 focus:border-pmr-500 outline-none transition">
                        </div>

                        <div class="pt-3">
                            <button type="button" id="btn-next-1" onclick="nextStep(1)" class="w-full py-3.5 px-5 bg-pmr-600 hover:bg-pmr-700 active:bg-pmr-800 text-white font-bold text-sm rounded-xl shadow-md shadow-pmr-600/20 flex items-center justify-center gap-2 transition cursor-pointer">
                                <span>Lanjut ke Keterangan Izin</span>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- SLIDE 2: DETAIL KETERANGAN IZIN -->
                    <div id="form-step-2" class="space-y-4 hidden">
                        <div>
                            <label for="tanggal" class="block text-sm font-semibold text-slate-700 mb-1">
                                Hari & Tanggal Kegiatan PMR <span class="text-pmr-600">*</span>
                            </label>
                            <input type="date" id="tanggal" required
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-pmr-500 focus:border-pmr-500 outline-none transition">
                        </div>

                        <div>
                            <label for="jenis-izin" class="block text-sm font-semibold text-slate-700 mb-1">
                                Jenis Izin <span class="text-pmr-600">*</span>
                            </label>
                            <select id="jenis-izin" required
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-pmr-500 focus:border-pmr-500 outline-none transition">
                                <option value="Sakit">Sakit</option>
                                <option value="Izin Kepentingan Keluarga">Izin Kepentingan Keluarga</option>
                                <option value="Izin Kegiatan Sekolah Lainnya">Izin Kegiatan Sekolah Lainnya</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>

                        <div>
                            <label for="alasan" class="block text-sm font-semibold text-slate-700 mb-1">
                                Alasan Lengkap / Keterangan <span class="text-pmr-600">*</span>
                            </label>
                            <textarea id="alasan" rows="3" required placeholder="Jelaskan alasan ketidakhadiran Anda secara jelas dan sopan..."
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-pmr-500 focus:border-pmr-500 outline-none transition resize-none"></textarea>
                        </div>

                        <div class="pt-3 grid grid-cols-2 gap-3">
                            <button type="button" id="btn-prev-2" onclick="window.goToStep(1)" class="py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-xl border border-slate-300 flex items-center justify-center gap-1.5 transition cursor-pointer">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                                </svg>
                                <span>Kembali</span>
                            </button>
                            <button type="button" id="btn-next-2" onclick="window.nextStep(2)" class="py-3 px-4 bg-pmr-600 hover:bg-pmr-700 text-white font-bold text-sm rounded-xl shadow-md shadow-pmr-600/20 flex items-center justify-center gap-1.5 transition cursor-pointer">
                                <span>Lanjut TTD</span>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- SLIDE 3: TANDA TANGAN DIGITAL & KIRIM -->
                    <div id="form-step-3" class="space-y-4 hidden">
                        <div>
                            <div class="flex items-center justify-between mb-1.5">
                                <label class="block text-sm font-semibold text-slate-700">
                                    Tanda Tangan Digital <span class="text-pmr-600">*</span>
                                </label>
                                <button type="button" id="clear-signature" class="inline-flex items-center gap-1 text-xs font-semibold text-pmr-600 hover:text-pmr-800 bg-pmr-50 hover:bg-pmr-100 px-2.5 py-1 rounded-lg transition">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                    Hapus / Ulangi
                                </button>
                            </div>
                            <div class="relative border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 overflow-hidden h-40" id="signature-wrapper">
                                <canvas id="signature-pad" class="w-full h-full block"></canvas>
                                <div id="signature-placeholder" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-slate-400">
                                    <svg class="w-6 h-6 mb-1 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                                    </svg>
                                    <span class="text-xs">Goreskan tanda tangan di kotak ini</span>
                                </div>
                            </div>
                        </div>

                        <!-- Tombol Aksi Utama -->
                        <div class="pt-2 space-y-3">
                            <button type="submit" id="btn-submit-email" class="w-full py-3.5 px-5 bg-pmr-600 hover:bg-pmr-700 active:bg-pmr-800 text-white font-bold text-sm rounded-xl shadow-md shadow-pmr-600/20 flex items-center justify-center gap-2 transition transform active:scale-[0.99]">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                                </svg>
                                <span>Kirim Otomatis ke Email Sekarang</span>
                            </button>

                            <div class="grid grid-cols-3 gap-2">
                                <button type="button" id="btn-prev-3" onclick="window.goToStep(2)" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl border border-slate-300 flex items-center justify-center gap-1 transition cursor-pointer">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                                    </svg>
                                    <span>Kembali</span>
                                </button>

                                <button type="button" id="btn-copy-letter" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl border border-slate-300 flex items-center justify-center gap-1 transition cursor-pointer">
                                    <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                                    </svg>
                                    <span>Salin Teks</span>
                                </button>

                                <button type="button" id="btn-print-letter" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl border border-slate-300 flex items-center justify-center gap-1 transition cursor-pointer">
                                    <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                                    </svg>
                                    <span>PDF / Cetak</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- KOLOM KANAN: LIVE PREVIEW SURAT RESMI (7 Kolom di layar besar) -->
            <div class="lg:col-span-7 flex flex-col">
                <div class="flex items
